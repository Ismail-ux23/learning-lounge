{% extends 'base.html' %}{% block content %}<a href="/admin/{{ kind }}">← {{ kind|title }}</a><h1>Edit {{ kind }}</h1><form method="post" class="panel form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field in fields %}<label>{{ field|replace('_',' ')|title }}{% if field in ['body','code','content','rules','description','objectives','mistakes','exercise','references'] %}<textarea name="{{ field }}" rows="{{ 14 if field in ['content','rules'] else 5 }}">{{ values[field] }}</textarea>{% elif field=='category' and kind=='courses' %}<input name="category" list="category-list" value="{{ values[field] }}"><datalist id="category-list">{% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}</datalist>{% else %}<input name="{{ field }}" value="{{ values[field] }}">{% endif %}</label>{% endfor %}<button class="button">Save changes</button><p class="fine">Archive referenced content instead of deleting it. Existing assessments retain their original snapshots.</p></form>{% endblock %}
