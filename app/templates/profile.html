{% extends 'base.html' %}{% block content %}<div class="reader"><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1>Your profile</h1><form class="panel form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name for future certificates<input name="name" value="{{ current_user.name }}" minlength="2" maxlength="100" required></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>Timezone<input name="timezone" value="{{ current_user.timezone }}" placeholder="Asia/Karachi" required></label><label>Learning interests<textarea name="interests" maxlength="1000">{{ current_user.interests }}</textarea></label><button class="button">Save profile</button></form></div>{% endblock %}
