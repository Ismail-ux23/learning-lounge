{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><h1>Reset your password</h1>{% if not mail_ready %}<div class="notice">Email delivery is not configured yet. Ask the administrator to connect a mail service.</div>{% endif %}<form method="post" class="panel form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if token %}<label>New password<input type="password" name="password" minlength="12" maxlength="128" required></label>{% else %}<label>Email<input type="email" name="email" required></label>{% endif %}<button class="button">{{ 'Set password' if token else 'Send reset link' }}</button></form></div>{% endblock %}
